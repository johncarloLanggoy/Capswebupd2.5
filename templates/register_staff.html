<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Staff — PetLink</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .particle {
      position: absolute;
      background: rgba(56, 189, 248, 0.3);
      border-radius: 50%;
      animation: float 15s infinite;
      pointer-events: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0; }
      50% { opacity: 0.5; }
      100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }

    .card {
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(56, 189, 248, 0.3);
      position: relative;
      z-index: 1;
      animation: slideUpFade 0.6s cubic-bezier(0.34, 1.2, 0.64, 1);
    }

    @keyframes slideUpFade {
      0% {
        opacity: 0;
        transform: translateY(50px) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .brand-name {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    h2 {
      color: white;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 500;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      color: #64748b;
    }

    input, select {
      width: 100%;
      padding: 12px 12px 12px 40px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      color: white;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    select {
      padding-right: 12px;
      appearance: none;
      cursor: pointer;
    }

    select option {
      background: #1e293b;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
      transform: scale(1.02);
    }

    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #0f172a;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.4);
    }

    .btn-secondary {
      background: #334155;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background: #475569;
      transform: translateY(-2px);
    }

    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      color: #10b981;
    }

    .message.error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #ef4444;
    }

    .card-footer {
      margin-top: 30px;
      text-align: center;
      padding-top: 20px;
      border-top: 1px solid #334155;
    }

    .card-footer a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .card-footer a:hover {
      color: #0ea5e9;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.6s linear infinite;
      margin-left: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .role-select-wrap {
      position: relative;
    }

    .role-select-wrap::after {
      content: '▼';
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Floating particles -->
  <div class="particles" id="particles"></div>

  <div class="card">
    <div class="brand">
      <div class="brand-icon">👤</div>
      <span class="brand-name">PetLink</span>
    </div>

    <h2>Create Staff Account</h2>
    <p class="subtitle">Register new clinic staff or veterinarian</p>

    <div class="form-stack">
      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="username" placeholder="Choose a username" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="password" placeholder="Create a strong password" required>
        </div>
      </div>

      <div class="field">
        <label for="role">Role</label>
        <div class="input-wrap role-select-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
          <select id="role">
            <option value="staff">Staff</option>
            <option value="vet">Veterinarian</option>
            <option value="user">Customer</option>
            <option value="admin">Admin</option>
          </select>
        </div>
      </div>

      <button class="btn-primary" id="registerBtn" onclick="handleRegister()">
        <span id="btnText">Create Account</span>
      </button>
      
      <button class="btn-secondary" onclick="window.location.href='/admin'">
        ← Back to Admin Panel
      </button>
    </div>

    <div id="message" class="message"></div>

    <div class="card-footer">
      <a href="/admin">Return to Admin Panel</a>
    </div>
  </div>

  <script>
    // Create floating particles
    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        const size = Math.random() * 5 + 2;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.top = `${Math.random() * 100}%`;
        particle.style.animationDelay = `${Math.random() * 15}s`;
        particle.style.animationDuration = `${Math.random() * 10 + 10}s`;
        particlesContainer.appendChild(particle);
      }
    }
    createParticles();

    async function handleRegister() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      const msg = document.getElementById('message');
      const btn = document.getElementById('registerBtn');
      const btnText = document.getElementById('btnText');
      
      const show = (text, type) => { 
        msg.textContent = text; 
        msg.className = 'message show ' + type; 
        setTimeout(() => {
          msg.classList.remove('show');
        }, 5000);
      };

      if (!username || !password) return show('Please fill in all fields.', 'error');

      btnText.innerHTML = 'Creating account... <span class="loading"></span>';
      btn.disabled = true;

      try {
        const res = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, role })
        });
        const data = await res.json();
        
        btnText.innerHTML = 'Create Account';
        btn.disabled = false;
        
        show(data.message, data.success ? 'success' : 'error');
        
        if (data.success) {
          setTimeout(() => window.location.href = '/admin', 2000);
        }
      } catch {
        btnText.innerHTML = 'Create Account';
        btn.disabled = false;
        show('Something went wrong. Please try again.', 'error');
      }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleRegister(); });
  </script>
</body>
</html>
