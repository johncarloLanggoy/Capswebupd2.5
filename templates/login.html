<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — PetLink</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>
  <!-- Floating particles -->
  <div class="particles" id="particles"></div>

  <div class="card">
    <div class="brand">
      <div class="brand-icon">🐾</div>
      <span class="brand-name">PetLink</span>
    </div>

    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to manage your pet care center</p>

    <div class="form-stack">
      <div class="field">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" id="email" placeholder="Your email address" autocomplete="email" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="password" placeholder="Your password" autocomplete="current-password" required style="padding-right:42px;">
          <button type="button" class="eye-toggle" onclick="toggleEye('password', this)" aria-label="Toggle password visibility">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="remember-row">
        <input type="checkbox" id="rememberMe">
        <label for="rememberMe">Remember me</label>
      </div>

      <button class="btn-primary" id="loginBtn" onclick="handleLogin()">
        <span id="btnText">Sign in</span>
      </button>
    </div>

    <div id="message" class="message"></div>
    <div id="countdown" style="display:none;"></div>

    <div class="card-footer">
      <a href="/forgot-password">Forgot password?</a><br>
      <a href="/">← Back to home</a>
    </div>
  </div>

  <script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
