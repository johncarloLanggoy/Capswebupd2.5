<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — PetLink</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .particle {
      position: absolute;
      background: rgba(56, 189, 248, 0.3);
      border-radius: 50%;
      animation: float 15s infinite;
      pointer-events: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0; }
      50% { opacity: 0.5; }
      100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }

    .card {
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(56, 189, 248, 0.3);
      position: relative;
      z-index: 1;
      animation: slideUpFade 0.6s cubic-bezier(0.34, 1.2, 0.64, 1);
    }

    @keyframes slideUpFade {
      0% {
        opacity: 0;
        transform: translateY(50px) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
      animation: fadeIn 0.8s ease 0.2s both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .brand-icon {
      font-size: 48px;
      margin-bottom: 10px;
      animation: bounce 1s ease infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .brand-name {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    h2 {
      color: white;
      font-size: 24px;
      margin-bottom: 8px;
      animation: slideInLeft 0.6s ease 0.3s both;
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 30px;
      animation: slideInLeft 0.6s ease 0.35s both;
    }

    .form-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: slideInRight 0.6s ease 0.4s both;
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    label {
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 500;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      color: #64748b;
      transition: all 0.3s ease;
    }

    input {
      width: 100%;
      padding: 12px 12px 12px 40px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      color: white;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
      transform: scale(1.02);
    }

    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #0f172a;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.6s ease 0.5s both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .btn-primary:active::before {
      width: 300px;
      height: 300px;
    }

    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
      animation: shake 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      color: #10b981;
      animation: successPulse 0.5s ease;
    }

    @keyframes successPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .message.error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #ef4444;
    }

    .card-footer {
      margin-top: 30px;
      text-align: center;
      padding-top: 20px;
      border-top: 1px solid #334155;
      animation: fadeIn 0.6s ease 0.55s both;
    }

    .card-footer a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .card-footer a:hover {
      color: #0ea5e9;
      transform: translateX(5px);
    }

    .reset-link-box {
      margin-top: 16px;
      padding: 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      word-break: break-all;
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .reset-link-box p {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 8px;
    }

    .reset-link-box a {
      font-size: 13px;
      color: #38bdf8;
      font-family: monospace;
      word-break: break-all;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.6s linear infinite;
      margin-left: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Floating particles -->
  <div class="particles" id="particles"></div>

  <div class="card">
    <div class="brand">
      <div class="brand-icon">🔓</div>
      <span class="brand-name">PetLink</span>
    </div>

    <h2>Reset your password</h2>
    <p class="subtitle">Enter your email and we'll generate a secure reset link (expires in 15 min)</p>

    <div class="form-stack">
      <div class="field">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" id="email" placeholder="Your email address" autocomplete="email" required>
        </div>
      </div>
      <button class="btn-primary" id="resetBtn" onclick="handleForgot()">
        <span id="btnText">Generate reset link</span>
      </button>
    </div>

    <div id="message" class="message"></div>
    <div id="resetLinkBox" style="display:none;" class="reset-link-box">
      <p>🔗 Reset Link (demo only — email in production)</p>
      <a id="resetLink" href="#" target="_blank"></a>
    </div>

    <div class="card-footer">
      <a href="/login">← Back to sign in</a>
    </div>
  </div>

  <script>
    // Create floating particles
    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        const size = Math.random() * 5 + 2;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.top = `${Math.random() * 100}%`;
        particle.style.animationDelay = `${Math.random() * 15}s`;
        particle.style.animationDuration = `${Math.random() * 10 + 10}s`;
        particlesContainer.appendChild(particle);
      }
    }
    createParticles();

    async function handleForgot() {
      const email = document.getElementById('email').value.trim();
      const msg = document.getElementById('message');
      const btn = document.getElementById('resetBtn');
      const btnText = document.getElementById('btnText');
      
      const show = (text, type) => { 
        msg.textContent = text; 
        msg.className = 'message show ' + type; 
        setTimeout(() => {
          msg.classList.remove('show');
        }, 5000);
      };

      if (!email) return show('Please enter your email address.', 'error');

      btnText.innerHTML = 'Generating... <span class="loading"></span>';
      btn.disabled = true;

      try {
        const res = await fetch('/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        
        btnText.innerHTML = 'Generate reset link';
        btn.disabled = false;
        
        show(data.message, 'success');

        if (data.reset_link) {
          const box = document.getElementById('resetLinkBox');
          const link = document.getElementById('resetLink');
          link.href = data.reset_link;
          link.textContent = data.reset_link;
          box.style.display = 'block';
          box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      } catch {
        btnText.innerHTML = 'Generate reset link';
        btn.disabled = false;
        show('Something went wrong. Please try again.', 'error');
      }
    }
    
    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleForgot(); });
    
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
      input.addEventListener('focus', () => {
        input.parentElement.style.transform = 'scale(1.02)';
      });
      input.addEventListener('blur', () => {
        input.parentElement.style.transform = 'scale(1)';
      });
    });
  </script>
</body>
</html>
